<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>北辰工作台 · 轻量仪表盘 · VBI</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        --ink: #28333e;
        --muted: #909aa4;
        --mint: #16c99e;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: #edf0f3;
        font-family: Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 3px solid #67d9bd;
        outline-offset: 5px;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.5;
      }
      h1,
      h2,
      p,
      figure {
        margin: 0;
      }
      button,
      fieldset {
        border: 0;
      }
      fieldset {
        padding: 0;
        margin: 0;
        min-width: 0;
      }
      button {
        background: none;
        color: inherit;
      }
      .shell {
        max-width: 1120px;
        margin: auto;
        padding: 32px 28px 24px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 44px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 650;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: #283d3a;
        color: white;
        font:
          italic 19px Georgia,
          serif;
      }
      .workspace {
        color: #8c969f;
        font-size: 11px;
      }
      .heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #96a0a9;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 27px;
        letter-spacing: -0.035em;
        font-weight: 650;
      }
      .subtitle {
        font-size: 12px;
        color: #96a0a9;
        margin-top: 10px;
      }
      #export {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #7e8993;
        font-size: 12px;
        border: 1px solid #dbe1e6;
        border-radius: 12px;
        padding: 10px 14px;
        background: #ffffff50;
      }
      #export:hover {
        background: #fff;
        color: #344c43;
      }
      .icon {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .icon-box {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        color: #69767e;
        background: #f0f4f6;
        flex-shrink: 0;
      }
      .icon-box.mint {
        background: #e0f9f1;
        color: var(--mint);
      }
      .icon-box.blue {
        background: #e7effc;
        color: #5c90d6;
      }
      .dashboard {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: 44px;
        gap: 18px;
      }
      .card-slot {
        min-width: 0;
        perspective: 1100px;
      }
      .metric-card {
        height: 100%;
        position: relative;
        border: 1px solid #ffffffb3;
        border-radius: 26px;
        background: #fbfdff;
        box-shadow: 0 18px 38px -22px #28394826;
        overflow: hidden;
        transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
        transform-style: preserve-3d;
      }
      .metric-card::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        background: radial-gradient(ellipse at var(--px, 50%) var(--py, 50%), #fff 0%, #c8ffeb24 34%, transparent 68%);
        opacity: var(--glow, 0);
        transition: opacity 0.24s;
        z-index: 2;
      }
      .metric-card > * {
        position: relative;
        z-index: 1;
      }
      .hero {
        padding: 26px 28px 24px;
        display: flex;
        flex-direction: column;
      }
      .card-heading {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-heading h2 {
        color: #949da6;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.025em;
      }
      .hero-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .segment {
        display: flex;
        background: #edf1f4;
        border-radius: 20px;
        padding: 3px;
      }
      .segment button {
        min-width: 51px;
        border-radius: 17px;
        padding: 6px 10px;
        font-size: 11px;
        color: #919ba5;
        transition:
          background 0.2s,
          color 0.2s,
          box-shadow 0.2s;
      }
      .segment button[aria-pressed='true'] {
        background: #fcfdff;
        color: #3d4852;
        font-weight: 600;
        box-shadow:
          0 2px 5px #2436440a,
          inset 0 0 0 1px #fff;
      }
      .metric-value {
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.05em;
        font-weight: 600;
      }
      .hero-value {
        display: block;
        font-size: clamp(38px, 4.4vw, 59px);
        margin: 14px 0 10px;
        line-height: 1.12;
      }
      .comparison {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 11px;
        color: #9ba4ad;
      }
      .change {
        color: var(--mint);
        font-weight: 600;
        white-space: nowrap;
      }
      .change[data-direction='down'] {
        color: #d47c6a;
      }
      .hero-figure {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        margin-top: 20px;
      }
      #trend {
        flex: 1;
        min-height: 150px;
        width: 100%;
      }
      .plot-labels {
        display: flex;
        justify-content: space-between;
        color: #9ba5ad;
        font-size: 11px;
        padding: 8px 2px 0;
      }
      .hero-bottom {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-top: 1px solid #e9eef2;
        padding-top: 24px;
        margin-top: 25px;
      }
      .submetric {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }
      .submetric + .submetric {
        border-left: 1px solid #e8eef3;
        padding-left: 24px;
      }
      .submetric .icon-box {
        width: 42px;
        height: 42px;
        border-radius: 12px;
      }
      .submetric p {
        font-size: 11px;
        color: #98a1aa;
        margin-bottom: 7px;
      }
      .submetric strong {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.035em;
      }
      .small-card {
        padding: 22px 23px;
      }
      .small-card .card-heading {
        gap: 9px;
      }
      .small-card .icon-box {
        width: 29px;
        height: 29px;
        border-radius: 9px;
      }
      .small-card .card-heading h2 {
        font-size: 10px;
      }
      .small-body {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 16px;
      }
      .small-value {
        display: block;
        font-size: 29px;
        line-height: 1;
        white-space: nowrap;
      }
      .small-card .comparison {
        display: block;
        margin-top: 10px;
        line-height: 1.65;
        font-size: 10px;
      }
      .small-card .comparison .change {
        display: block;
        margin-bottom: 1px;
      }
      .mini-plot {
        width: clamp(82px, 9vw, 116px);
        height: 77px;
        flex-shrink: 0;
        align-self: flex-end;
      }
      #growth-card .mini-plot {
        margin-top: -9px;
      }
      #growth {
        font-size: 31px;
      }
      #profit {
        font-size: 27px;
      }
      .ring-wrap {
        flex-shrink: 0;
        text-align: center;
      }
      .ring {
        --share: 0%;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: conic-gradient(from -25deg, #56dabb var(--share), #c1f3e6 0);
        display: grid;
        place-items: center;
      }
      .ring::before {
        content: '';
        width: 53px;
        height: 53px;
        background: #fbfdff;
        border-radius: 50%;
        grid-area: 1/1;
      }
      .ring-value {
        grid-area: 1/1;
        z-index: 1;
        font-size: 14px;
        font-weight: 550;
        font-variant-numeric: tabular-nums;
      }
      .ring-label {
        font-size: 8px;
        color: #99a6ae;
        margin-top: 5px;
      }
      .details {
        margin-top: 22px;
        border-radius: 20px;
        background: #ffffff65;
        border: 1px solid #ffffff80;
      }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
        cursor: pointer;
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      .summary-title {
        font-size: 12px;
        color: #71818b;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .summary-note {
        color: #9aa5ad;
        font-size: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .chevron {
        width: 14px;
        transition: transform 0.3s;
      }
      details[open] .chevron {
        transform: rotate(180deg);
      }
      .table-wrap {
        overflow-x: auto;
        padding: 0 22px 18px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        white-space: nowrap;
        font-size: 12px;
      }
      th,
      td {
        padding: 13px 8px;
        text-align: right;
        border-bottom: 1px solid #e4ebef;
        font-variant-numeric: tabular-nums;
      }
      th {
        color: #94a0a8;
        font-weight: 400;
        font-size: 10px;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      tr:last-child td {
        border: 0;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: #9aa5af;
        font-size: 10px;
        margin-top: 23px;
      }
      .status-dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #6bcdb6;
        margin-right: 7px;
      }
      #status {
        font-size: 10px;
      }
      body[data-state='error'] #status {
        color: #bd665c;
      }
      body:not([data-entrance='complete']) [data-enter] {
        opacity: 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      @media (max-width: 991px) {
        .shell {
          max-width: 720px;
          padding: 26px 22px;
        }
        .dashboard {
          grid-auto-rows: 44px;
        }
        .topbar {
          margin-bottom: 32px;
        }
        .small-card {
          padding: 22px 26px;
        }
        .mini-plot {
          width: 150px;
          height: 90px;
        }
        .small-body {
          margin-top: 12px;
        }
      }
      @media (max-width: 540px) {
        .shell {
          padding: 22px 16px;
        }
        .workspace {
          font-size: 9px;
        }
        .heading {
          align-items: center;
        }
        h1 {
          font-size: 24px;
        }
        .eyebrow {
          font-size: 9px;
        }
        #export {
          padding: 9px;
          font-size: 0;
          gap: 0;
        }
        #export .icon {
          width: 18px;
        }
        .hero {
          padding: 23px 20px;
        }
        .hero-top {
          gap: 10px;
        }
        .hero-top .icon-box {
          display: none;
        }
        .hero-top h2 {
          font-size: 10px;
        }
        .segment button {
          min-width: 43px;
          padding: 6px 8px;
        }
        .hero-value {
          font-size: 43px;
          margin-top: 23px;
        }
        .hero-bottom {
          padding-top: 22px;
        }
        .submetric {
          gap: 9px;
        }
        .submetric + .submetric {
          padding-left: 16px;
        }
        .submetric .icon-box {
          width: 34px;
          height: 36px;
        }
        .submetric strong {
          font-size: 22px;
        }
        .submetric p {
          font-size: 10px;
        }
        .small-card {
          padding: 20px 24px;
        }
        .mini-plot {
          width: clamp(80px, 26vw, 115px);
        }
        .summary-note {
          font-size: 9px;
          gap: 8px;
        }
        .summary-title {
          font-size: 11px;
        }
        summary {
          padding: 18px;
        }
        .table-wrap {
          padding: 0 10px 12px;
        }
        footer {
          font-size: 9px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .metric-card {
          transform: none !important;
        }
        body:not([data-entrance='complete']) [data-enter] {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body data-state="loading">
    <svg aria-hidden="true" width="0" height="0" style="position: absolute; overflow: hidden">
      <symbol id="icon-bag" viewBox="0 0 24 24">
        <path d="M5 7h14l1 13H4L5 7Z" />
        <path d="M8 8V6a4 4 0 0 1 8 0v2" />
      </symbol>
      <symbol id="icon-trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-10M15 5h6v6" /></symbol>
      <symbol id="icon-users" viewBox="0 0 24 24">
        <circle cx="10" cy="7" r="3" />
        <path d="M3 20v-2a7 7 0 0 1 14 0v2H3ZM17 4a3 3 0 0 1 0 6M19 13c2 1 3 3 3 5" />
      </symbol>
      <symbol id="icon-target" viewBox="0 0 24 24">
        <path d="M20 9a8 8 0 1 1-5-5" />
        <path d="M16 9a4.5 4.5 0 1 1-3-2" />
        <path d="m12 12 9-9M17 3h4v4" />
      </symbol>
      <symbol id="icon-wallet" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="15" rx="3" />
        <path d="M3 8V5a2 2 0 0 1 2-2h12M21 10h-7v5h7M17 12.5h.1" />
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4" /></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
    </svg>
    <div class="shell">
      <header class="topbar" data-enter="0">
        <div class="brand"><span class="brand-mark">N</span>北辰工作台</div>
        <span class="workspace">销售运营 / 演示空间</span>
      </header>
      <main>
        <section class="heading" data-enter="1">
          <div>
            <p class="eyebrow">A LITTLE CLARITY, EVERY DAY</p>
            <h1>经营概览</h1>
            <p class="subtitle" id="period-label">2026 年 9 月 1 日 — 30 日</p>
          </div>
          <button id="export" disabled>
            <svg class="icon"><use href="#icon-download" /></svg>下载配置
          </button>
        </section>
        <section id="dashboard" class="dashboard" aria-label="销售指标仪表盘">
          <div id="hero-slot" class="card-slot" data-enter="2">
            <article id="hero-card" class="metric-card hero" aria-labelledby="hero-title">
              <div class="hero-top">
                <div class="card-heading">
                  <span class="icon-box"
                    ><svg class="icon"><use href="#icon-bag" /></svg
                  ></span>
                  <h2 id="hero-title">销售总额</h2>
                </div>
                <fieldset disabled class="segment" aria-label="选择统计天数">
                  <button data-days="7" aria-pressed="false">7 天</button
                  ><button data-days="12" aria-pressed="false">12 天</button
                  ><button data-days="30" aria-pressed="true">30 天</button>
                </fieldset>
              </div>
              <strong id="sales" class="metric-value hero-value">—</strong>
              <p class="comparison">
                <span id="sales-change" class="change">—</span><span class="compare-label">较前 30 天</span>
              </p>
              <figure class="hero-figure">
                <div id="trend" role="img" aria-label="每日销售额趋势，悬停可查看明细"></div>
                <figcaption class="plot-labels">
                  <span id="date-first">09/01</span><span id="date-middle">09/15</span><span>09/30</span>
                </figcaption>
              </figure>
              <div class="hero-bottom">
                <div class="submetric" data-enter="6">
                  <span class="icon-box mint"
                    ><svg class="icon"><use href="#icon-trend" /></svg
                  ></span>
                  <div>
                    <p>综合毛利率</p>
                    <strong id="margin">—</strong>
                  </div>
                </div>
                <div class="submetric" data-enter="7">
                  <span class="icon-box blue"
                    ><svg class="icon"><use href="#icon-users" /></svg
                  ></span>
                  <div>
                    <p>平均客单价</p>
                    <strong id="average">—</strong>
                  </div>
                </div>
              </div>
            </article>
          </div>
          <div id="growth-slot" class="card-slot" data-enter="3">
            <article id="growth-card" class="metric-card small-card" aria-labelledby="growth-title">
              <div class="card-heading">
                <span class="icon-box mint"
                  ><svg class="icon"><use href="#icon-target" /></svg
                ></span>
                <h2 id="growth-title">销售增长</h2>
              </div>
              <div class="small-body">
                <div>
                  <strong id="growth" class="metric-value small-value">—</strong>
                  <p class="comparison compare-label">较前 30 天</p>
                </div>
                <div id="growth-trend" class="mini-plot" role="img" aria-label="所选时段销售额走势"></div>
              </div>
            </article>
          </div>
          <div id="orders-slot" class="card-slot" data-enter="4">
            <article id="orders-card" class="metric-card small-card" aria-labelledby="orders-title">
              <div class="card-heading">
                <span class="icon-box"
                  ><svg class="icon"><use href="#icon-users" /></svg
                ></span>
                <h2 id="orders-title">订单总数</h2>
              </div>
              <div class="small-body">
                <div>
                  <strong id="orders" class="metric-value small-value">—</strong>
                  <p class="comparison">
                    <span id="orders-change" class="change">—</span><span class="compare-label">较前 30 天</span>
                  </p>
                </div>
                <div class="ring-wrap">
                  <div
                    class="ring"
                    id="online-ring"
                    role="meter"
                    aria-label="线上商城订单占比"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                  >
                    <span class="ring-value" id="online-share">—</span>
                  </div>
                  <p class="ring-label">线上订单占比</p>
                </div>
              </div>
            </article>
          </div>
          <div id="profit-slot" class="card-slot" data-enter="5">
            <article id="profit-card" class="metric-card small-card" aria-labelledby="profit-title">
              <div class="card-heading">
                <span class="icon-box"
                  ><svg class="icon"><use href="#icon-wallet" /></svg
                ></span>
                <h2 id="profit-title">毛利润</h2>
              </div>
              <div class="small-body">
                <div>
                  <strong id="profit" class="metric-value small-value">—</strong>
                  <p class="comparison">
                    <span id="profit-change" class="change">—</span><span class="compare-label">较前 30 天</span>
                  </p>
                </div>
                <div id="profit-trend" class="mini-plot" role="img" aria-label="最近七天每日毛利润"></div>
              </div>
            </article>
          </div>
        </section>
        <details class="details" id="region-details" data-enter="8">
          <summary>
            <span class="summary-title"
              ><svg class="icon"><use href="#icon-bag" /></svg>查看区域明细</span
            ><span class="summary-note"
              >4 个区域<svg class="icon chevron"><use href="#icon-chevron" /></svg
            ></span>
          </summary>
          <div class="table-wrap">
            <table>
              <caption class="sr-only">
                各地区销售额、订单数及毛利率
              </caption>
              <thead>
                <tr>
                  <th scope="col">地区</th>
                  <th scope="col">销售额</th>
                  <th scope="col">订单数</th>
                  <th scope="col">毛利率</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </details>
      </main>
      <footer>
        <p id="status" role="status">正在加载 npm 模块…</p>
        <span data-enter="9"><span class="status-dot"></span>数据让每一步更清晰</span>
      </footer>
    </div>
    <noscript>此示例需要启用 JavaScript 来加载图表。</noscript>

    <script type="module">
      import { VBI } from 'https://cdn.jsdelivr.net/npm/@visactor/vbi@0.6.0/+esm'
      import { VQuery } from 'https://cdn.jsdelivr.net/npm/@visactor/vquery@0.6.0/dist/browser/esm/browser.js/+esm'
      import { Builder, registerAll } from 'https://cdn.jsdelivr.net/npm/@visactor/vseed@0.6.0/+esm'
      import VChart from 'https://cdn.jsdelivr.net/npm/@visactor/vchart@2.0.23-alpha.6/+esm'

      registerAll()
      const $ = (selector) => document.querySelector(selector)
      const number = (value) => new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 0 }).format(value)
      const money = (value) => `¥${number(value)}`
      const instances = new Map()
      const status = $('#status')

      // 确定性的演示数据；业务聚合与筛选由 VBI → VQuery 执行。
      async function connectDemo(connectorId) {
        const rawDataset = []
        const regions = ['华东', '华南', '华北', '西南']
        const channels = ['线上商城', '线下门店', '合作伙伴']
        const products = ['数码配件', '家居生活', '运动户外', '个护美妆']
        // day=1..30 为九月；前 30 天只用于等长周期比较，不改变九月数据。
        for (let day = -29; day <= 30; day++) {
          const localDay = day > 0 ? day : day + 30
          const month = day > 0 ? '09' : '08'
          const calendarDay = day > 0 ? day : day + 31
          regions.forEach((region, r) =>
            channels.forEach((channel, c) => {
              const baseOrders = 16 + localDay * 0.7 + (3 - r) * 9 + (2 - c) * 5 + Math.sin(localDay * 0.6 + r) * 8
              const orders = Math.round(baseOrders * (day > 0 ? 1 : 0.86))
              const sales = orders * (145 + r * 19 + c * 26)
              rawDataset.push({
                day,
                date: `${month}/${String(calendarDay).padStart(2, '0')}`,
                region,
                channel,
                product: products[(localDay + r + c) % 4],
                sales,
                orders,
                profit: Math.round(sales * (0.22 + c * 0.04)),
              })
            }),
          )
        }
        const schema = Object.keys(rawDataset[0]).map((name) => ({
          name,
          type: typeof rawDataset[0][name] === 'number' ? 'number' : 'string',
        }))
        const query = new VQuery()
        const source = { type: 'json', rawDataset }
        if (await query.hasDataset(connectorId)) await query.updateDatasetSource(connectorId, schema, source)
        else await query.createDataset(connectorId, schema, source)
        VBI.connectors.register(connectorId, {
          discoverSchema: async () => schema,
          query: async ({ queryDSL }) => {
            const dataset = await query.connectDataset(connectorId)
            try {
              return await dataset.query(queryDSL)
            } finally {
              await dataset.disconnect()
            }
          },
        })
      }

      function createChart(connectorId, type, dimension, measures = ['sales'], theme = 'light') {
        const chart = VBI.chart.create(VBI.chart.createEmpty(connectorId))
        chart.chartType.changeChartType(type)
        chart.theme.setTheme(theme)
        if (dimension)
          chart.dimensions.add(dimension, (node) =>
            node.setAlias({ date: '日期', region: '地区', channel: '渠道', product: '品类' }[dimension]),
          )
        measures.forEach((field) =>
          chart.measures.add(field, (node) =>
            node
              .setAlias({ sales: '销售额', orders: '订单数', profit: '毛利润' }[field])
              .setAggregate({ func: 'sum' })
              .setFormat({ type: 'number', fractionDigits: 0 }),
          ),
        )
        return chart
      }

      // 仅将查询结果列 ID 映射回业务字段，保留 VQuery 的聚合结果。
      async function rowsOf(chart) {
        const seed = await chart.buildVSeed()
        const dsl = chart.build()
        return seed.dataset.map((row) =>
          Object.fromEntries([...dsl.dimensions, ...dsl.measures].map((field) => [field.field, row[field.id]])),
        )
      }

      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)')
      let entrances = []
      let hasEntered = false

      function finishEntrance() {
        document.body.dataset.entrance = 'complete'
        entrances.forEach((animation) => animation.cancel())
        entrances = []
      }
      function revealComponents() {
        if (hasEntered) return
        hasEntered = true
        if (reducedMotion.matches) return finishEntrance()
        entrances = [...document.querySelectorAll('[data-enter]')].map((element) =>
          element.animate(
            [
              { opacity: 0, transform: 'translateY(18px)' },
              { opacity: 1, transform: 'translateY(0)' },
            ],
            {
              duration: 650,
              delay: Number(element.dataset.enter) * 95,
              easing: 'cubic-bezier(.2,.75,.25,1)',
              fill: 'both',
            },
          ),
        )
        Promise.all(entrances.map((animation) => animation.finished.catch(() => {}))).then(finishEntrance)
      }
      reducedMotion.addEventListener('change', () => {
        if (reducedMotion.matches) finishEntrance()
      })

      // 入场作用于外层 slot；倾斜作用于内层 card，两种 transform 互不覆盖。
      function bindCardMotion(card) {
        const slot = card.parentElement
        let targetX = 0,
          targetY = 0,
          x = 0,
          y = 0,
          vx = 0,
          vy = 0,
          frame = 0,
          last = 0
        function tick(now) {
          const dt = last ? Math.min((now - last) / 16.667, 2) : 1
          last = now
          vx = (vx + (targetX - x) * 0.14 * dt) * Math.pow(0.76, dt)
          vy = (vy + (targetY - y) * 0.14 * dt) * Math.pow(0.76, dt)
          x += vx * dt
          y += vy * dt
          card.style.setProperty('--rx', `${x.toFixed(3)}deg`)
          card.style.setProperty('--ry', `${y.toFixed(3)}deg`)
          if (Math.abs(targetX - x) + Math.abs(targetY - y) + Math.abs(vx) + Math.abs(vy) > 0.008)
            frame = requestAnimationFrame(tick)
          else {
            frame = 0
            last = 0
            card.style.setProperty('--rx', `${targetX}deg`)
            card.style.setProperty('--ry', `${targetY}deg`)
          }
        }
        function start() {
          if (!frame) frame = requestAnimationFrame(tick)
        }
        function reset() {
          targetX = 0
          targetY = 0
          card.style.setProperty('--glow', '0')
          if (reducedMotion.matches) {
            cancelAnimationFrame(frame)
            frame = 0
            last = 0
            x = y = vx = vy = 0
            card.style.setProperty('--rx', '0deg')
            card.style.setProperty('--ry', '0deg')
          } else start()
        }
        slot.addEventListener('pointermove', (event) => {
          if (reducedMotion.matches || document.body.dataset.entrance !== 'complete') return
          const rect = slot.getBoundingClientRect()
          const px = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width))
          const py = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height))
          const strength = event.pointerType === 'touch' ? 2 : 3.5
          targetX = (0.5 - py) * strength * 2
          targetY = (px - 0.5) * strength * 2
          card.style.setProperty('--px', `${px * 100}%`)
          card.style.setProperty('--py', `${py * 100}%`)
          card.style.setProperty('--glow', '.48')
          start()
        })
        slot.addEventListener('pointerleave', reset)
        slot.addEventListener('pointercancel', reset)
        slot.addEventListener('pointerup', (event) => {
          if (event.pointerType === 'touch') reset()
        })
        reducedMotion.addEventListener('change', reset)
      }
      document.querySelectorAll('.metric-card').forEach(bindCardMotion)

      async function draw(chart, element, mini = false) {
        const seed = await chart.buildVSeed()
        if (seed.chartType === 'column') seed.dataset = seed.dataset.slice(-7)
        const dateId = seed.dimensions[0].id
        const valueId = seed.measures[0].id
        const values = seed.dataset.map((row) => Number(row[valueId]))
        const lastDate = seed.dataset.at(-1)[dateId]
        Object.assign(seed, {
          backgroundColor: 'transparent',
          color: { colorScheme: ['#19cba1'] },
          label: { enable: false },
          legend: { enable: false },
          xAxis: { visible: false },
          yAxis: {
            visible: false,
            zero: seed.chartType === 'column',
            min: seed.chartType === 'column' ? 0 : Math.min(...values) * 0.78,
            max: Math.max(...values) * 1.06,
          },
          lineStyle: { lineWidth: mini ? 2 : 2.5, lineSmooth: true },
          pointStyle: [
            { pointVisible: false },
            {
              selector: { [dateId]: lastDate },
              pointVisible: true,
              pointSize: mini ? 6 : 8,
              pointColor: '#19cba1',
              pointBorderWidth: 0,
            },
          ],
        })
        const spec = Builder.from(seed).build()
        spec.animation = false
        spec.padding = { top: 8, bottom: 4, left: 3, right: 9 }
        if (seed.chartType === 'area') {
          spec.area = {
            ...spec.area,
            style: {
              ...spec.area?.style,
              fillOpacity: 1,
              fill: {
                gradient: 'linear',
                x0: 0,
                y0: 0,
                x1: 0,
                y1: 1,
                stops: [
                  { offset: 0, color: 'rgba(25,203,161,.27)' },
                  { offset: 1, color: 'rgba(25,203,161,0)' },
                ],
              },
            },
          }
        }
        if (seed.chartType === 'column') {
          spec.bar = { ...spec.bar, style: { ...spec.bar?.style, cornerRadius: [4, 4, 4, 4], fillOpacity: 0.68 } }
        }
        instances.get(element)?.release()
        const instance = new VChart(spec, { dom: element })
        instance.renderSync()
        instances.set(element, instance)
      }

      function download(filename, value) {
        const url = URL.createObjectURL(new Blob([JSON.stringify(value, null, 2)], { type: 'application/json' }))
        const link = Object.assign(document.createElement('a'), { href: url, download: filename })
        link.click()
        setTimeout(() => URL.revokeObjectURL(url), 1000)
      }
      async function run(task) {
        $('fieldset').disabled = true
        $('#export').disabled = true
        document.body.dataset.state = 'loading'
        status.textContent = '正在加载数据…'
        try {
          await task()
          document.body.dataset.state = 'ready'
          status.textContent = '固定演示数据 · 2026 年 9 月'
          revealComponents()
        } catch (error) {
          document.body.dataset.state = 'error'
          status.textContent = `加载失败：${error.message}`
          finishEntrance()
          console.error(error)
        } finally {
          $('fieldset').disabled = false
          $('#export').disabled = false
        }
      }
      function bindWidget(dashboard, chart, slot, title, lg, xs) {
        dashboard.chart.add((widget) => widget.setChart(chart).setTitle(title).setLayouts({ lg, xs }))
        slot.dataset.widget = dashboard.chart.find(chart.getUUID()).getId()
      }
      function layoutDashboard(dashboard) {
        const dsl = dashboard.build()
        const breakpoint = innerWidth >= dsl.breakpoints.lg ? 'lg' : 'xs'
        for (const item of dsl.layout[breakpoint]) {
          const slot = document.querySelector(`[data-widget="${item.widgetId}"]`)
          slot.style.gridColumn = `${item.x + 1} / span ${item.w}`
          slot.style.gridRow = `${item.y + 1} / span ${item.h}`
        }
        requestAnimationFrame(() =>
          instances.forEach((chart, element) => chart.resize(element.clientWidth, element.clientHeight)),
        )
      }
      function setPeriod(chart, first, last) {
        chart.whereFilter.clear()
        chart.whereFilter.add('day', (node) => node.setOperator('between').setValue({ min: first, max: last }))
      }
      function changeText(current, previous) {
        if (!previous) return { text: '暂无可比数据', direction: 'flat', percent: '—' }
        const percent = (current / previous - 1) * 100
        return {
          text: `${percent >= 0 ? '↑' : '↓'} ${Math.abs(percent).toFixed(1)}%`,
          direction: percent < 0 ? 'down' : 'up',
          percent: `${percent >= 0 ? '+' : ''}${percent.toFixed(1)}%`,
        }
      }
      function setChange(selector, change) {
        $(selector).textContent = change.text
        $(selector).dataset.direction = change.direction
      }
      const connectorId = 'vbi-example-lightweight'
      let days = 30
      await run(async () => {
        await connectDemo(connectorId)
        const dashboard = VBI.dashboard.create({
          ...VBI.dashboard.createEmpty(),
          meta: { title: '北辰工作台 · 经营概览', theme: 'light' },
        })
        const trend = createChart(connectorId, 'area', 'date')
        const growth = createChart(connectorId, 'area', 'date')
        const totals = createChart(connectorId, 'table', null, ['sales', 'orders', 'profit'])
        const profit = createChart(connectorId, 'column', 'date', ['profit'])
        const previous = createChart(connectorId, 'table', null, ['sales', 'orders', 'profit'])
        const online = createChart(connectorId, 'table', null, ['orders'])
        const regions = createChart(connectorId, 'table', 'region', ['sales', 'orders', 'profit'])
        bindWidget(
          dashboard,
          trend,
          $('#hero-slot'),
          '销售总额',
          { x: 0, y: 0, w: 8, h: 9 },
          { x: 0, y: 0, w: 12, h: 9 },
        )
        bindWidget(
          dashboard,
          growth,
          $('#growth-slot'),
          '销售增长',
          { x: 8, y: 0, w: 4, h: 3 },
          { x: 0, y: 9, w: 12, h: 3 },
        )
        bindWidget(
          dashboard,
          totals,
          $('#orders-slot'),
          '订单总数',
          { x: 8, y: 3, w: 4, h: 3 },
          { x: 0, y: 12, w: 12, h: 3 },
        )
        bindWidget(
          dashboard,
          profit,
          $('#profit-slot'),
          '毛利润',
          { x: 8, y: 6, w: 4, h: 3 },
          { x: 0, y: 15, w: 12, h: 3 },
        )
        async function render() {
          for (const chart of [trend, growth, totals, profit, online, regions]) setPeriod(chart, 31 - days, 30)
          setPeriod(previous, 31 - days * 2, 30 - days)
          online.whereFilter.add('channel', (node) => node.setOperator('eq').setValue('线上商城'))
          const [[total], [prior], [onlineTotal], daily, regionRows] = await Promise.all([
            rowsOf(totals),
            rowsOf(previous),
            rowsOf(online),
            rowsOf(trend),
            rowsOf(regions),
          ])
          const salesChange = changeText(total.sales, prior.sales)
          $('#sales').textContent = money(total.sales)
          $('#orders').textContent = number(total.orders)
          $('#profit').textContent = money(total.profit)
          $('#average').textContent = money(total.sales / total.orders)
          $('#margin').textContent = `${((total.profit / total.sales) * 100).toFixed(1)}%`
          $('#growth').textContent = salesChange.percent
          setChange('#sales-change', salesChange)
          setChange('#orders-change', changeText(total.orders, prior.orders))
          setChange('#profit-change', changeText(total.profit, prior.profit))
          document.querySelectorAll('.compare-label').forEach((label) => (label.textContent = `较前 ${days} 天`))
          const share = (onlineTotal.orders / total.orders) * 100
          $('#online-ring').style.setProperty('--share', `${share}%`)
          $('#online-ring').setAttribute('aria-valuenow', share.toFixed(1))
          $('#online-share').textContent = `${Math.round(share)}%`
          $('#period-label').textContent = `2026 年 9 月 ${31 - days} 日 — 30 日`
          $('#date-first').textContent = daily[0].date
          $('#date-middle').textContent = daily[Math.floor((daily.length - 1) / 2)].date
          $('tbody').replaceChildren()
          for (const row of regionRows) {
            const tr = document.createElement('tr')
            for (const value of [
              row.region,
              money(row.sales),
              number(row.orders),
              `${((row.profit / row.sales) * 100).toFixed(1)}%`,
            ]) {
              const td = document.createElement('td')
              td.textContent = value
              tr.append(td)
            }
            $('tbody').append(tr)
          }
          layoutDashboard(dashboard)
          await draw(trend, $('#trend'))
          await draw(growth, $('#growth-trend'), true)
          await draw(profit, $('#profit-trend'), true)
        }
        document.querySelectorAll('[data-days]').forEach((button) =>
          button.addEventListener('click', () =>
            run(async () => {
              days = Number(button.dataset.days)
              document
                .querySelectorAll('[data-days]')
                .forEach((item) => item.setAttribute('aria-pressed', String(item === button)))
              await render()
            }),
          ),
        )
        $('#export').addEventListener('click', () =>
          download('lightweight-dashboard.json', { dashboard: dashboard.build(), resources: VBI.resources.snapshot() }),
        )
        $('#region-details').addEventListener('toggle', (event) => {
          if (!event.target.open || reducedMotion.matches) return
          document.querySelectorAll('tbody tr').forEach((row, index) =>
            row.animate(
              [
                { opacity: 0, transform: 'translateY(6px)' },
                { opacity: 1, transform: 'translateY(0)' },
              ],
              { duration: 320, delay: index * 55, fill: 'backwards', easing: 'ease-out' },
            ),
          )
        })
        window.addEventListener('resize', () => layoutDashboard(dashboard))
        await render()
      })
    </script>
  </body>
</html>
